    <div class="header">
        <button class="register-btn">Регистрация</button>
        <button class="login-btn">Вход</button>
    </div>
    <div class="text-underBtns">
        <p>*Чтобы воспользоваться всеми функциями, войдите или зарегистрируйтесь.</p>
        <p>Без авторизации бот недоступен — это нужно для вашей безопасности и персонализированной работы.</p>
    </div>
    <dialog class="registerDialog">
        <form id="registration-form" method="dialog" novalidate>
            <h2>Регистрации</h2>
            <div class="block-form">
                <label for="username">Имя (обязательно):</label>
                <input type="text" id="username" name="username" required minlength="4" pattern="^(?=.*[A-Za-z])[A-Za-z0-9]+$"required>
                <span class="error-message" id="username-error" aria-live="polite" hidden></span>
            </div>
            <div class="block-form">
                <label for="password">Пароль (обязательно):</label>
                
                <div class="input-password">
                    <input type="password" id="password" name="password" required required minlength="8"
                    pattern="^[A-Za-z0-9!@#$%^&*()_+=\-{}[\]:;\<>,.?/~`]+$" required>
                    <button type="button" class="toggle-password">
                        <img src="/img/toggle-password.svg">
                    </button>
                </div>
                <span class="error-message" id="password-error" aria-live="polite" hidden></span>

            </div>
            <div class="dialogBtn">
                <button type="submit" class="send-btn">Отправить</button>
                <button type="button" class="close-btn">Закрыть</button>
            </div>        
        </form>
    </dialog>

    <dialog class="loginDialog">
        <form class="login-form" method="dialog">
            <h2>Вход</h2>
            <div class="block-form">
                <label>Имя:</label>
                <input type="text" name="username" id="login-username" required minlength="4">
                <span id="login-username-error" class="error-message" hidden></span>
            </div>
            <div class="block-form">
                <label> Пароль:</label>
                <div class="input-password">
                    <input type="password" name="password" id="login-password" required minlength="8">
                    <button type="button" class="toggle-password">
                        <img src="/img/toggle-password.svg">
                    </button>
                </div>
                <span id="login-password-error" class="error-message" hidden></span>
            </div>
            <div class="dialogBtn">
                <button type="submit" class="send-btn">Войти</button>
                <button type="button" class="login-close-btn">Закрыть</button>
            </div>
        </form>
    </dialog>
    <script type="module" src="/js/registration.js"></script>
    <script type="module" src="/js/login.js"></script>
